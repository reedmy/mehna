[project]
name = "mehna"
version = "2.0.0"
description = "مهنة — منصة التوظيف العراقية"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "migrations", "instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI-style defaults are not used here

[tool.ruff.format]
quote-style = "double"
