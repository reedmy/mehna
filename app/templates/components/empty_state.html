{% import "components/icons.html" as ui %}
<div class="empty">
  <div class="empty-icon">{{ ui.icon(icon or 'search', 24) }}</div>
  <h3>{{ title or 'لا توجد نتائج' }}</h3>
  <p>{{ body or 'جرّب تعديل البحث أو توسيع المدينة.' }}</p>
  {% if cta_label and cta_url %}
    <a class="btn btn-soft btn-sm" href="{{ cta_url }}">{{ cta_label }}</a>
  {% endif %}
</div>
