{% extends "base.html" %}
{% block title %}تعيين كلمة مرور جديدة — {{ site_name }}{% endblock %}
{% block footer %}{% endblock %}
{% block mobile_nav %}{% endblock %}

{% block content %}
<div class="container container-narrow section">
  <div class="card">
    <h1 style="font-size:var(--fs-xl)" class="mb-4">كلمة مرور جديدة</h1>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="password">كلمة المرور الجديدة</label>
        <input class="input" id="password" name="password" type="password" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password_confirm">تأكيد كلمة المرور</label>
        <input class="input" id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">حفظ كلمة المرور</button>
    </form>
  </div>
</div>
{% endblock %}
